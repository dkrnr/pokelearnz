name: PokeLearn CI
on:
  push:
    branches: [main, redesign/kid-friendly-v3, backend/hardening]
  pull_request:
    branches: [main, redesign/kid-friendly-v3]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/test-all.mjs
        env:
          CI: 'true'
